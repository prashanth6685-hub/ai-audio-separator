# Render Blueprint for the AI Audio Separator app.
# Deploy from the Render dashboard: New -> Blueprint -> paste the repo URL,
# or use https://render.com/deploy?repo=https://github.com/prashanth6685-hub/ai-audio-separator
#
# Notes:
# - The frontend talks to the backend through Next.js rewrites (/api/*),
#   so the browser only ever needs the frontend URL.
# - The backend runs on the Standard plan (2 GB RAM): the free tier's
#   512 MB gets OOM-killed by Demucs mid-job (confirmed 2026-10-12), which
#   also wiped the ephemeral filesystem and caused "Job not found".
#   Starter ($7/mo) is still 512 MB — it does NOT fix the OOM.
# - A 1 GB persistent disk (~$0.25/GB/month) is mounted at /data so jobs.db,
#   uploads, and the Demucs checkpoint survive restarts and deploys.
#   The backend's startup recovery marks any job stranded mid-flight by a
#   restart as failed with a clear message instead of leaving it stuck.

services:
  - type: web
    name: ai-audio-separator-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: standard
    healthCheckPath: /api/v1/health
    disk:
      name: audioapp-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: AUDIOAPP_DATA_DIR
        value: /data
      # Keep the downloaded Demucs checkpoint on the persistent disk too,
      # so the first separation after a restart isn't slow re-downloading it.
      - key: TORCH_HOME
        value: /data/torch-cache
      - key: AUDIOAPP_CORS_ORIGINS
        value: '["https://ai-audio-separator-frontend.onrender.com"]'
      - key: AUDIOAPP_LOG_LEVEL
        value: INFO

  - type: web
    name: ai-audio-separator-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    healthCheckPath: /
    envVars:
      # Baked into the frontend at build time: the browser calls the backend
      # directly, so the app works even if the /api rewrite proxy is unhappy.
      - key: NEXT_PUBLIC_API_URL
        value: https://ai-audio-separator-backend.onrender.com
      # Kept as a fallback for same-origin serving (docker-compose).
      - key: API_PROXY_TARGET
        value: https://ai-audio-separator-backend.onrender.com
